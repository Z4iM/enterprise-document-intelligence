name: Enterprise Document Intelligence CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Python Tests and Code Quality
    runs-on: ubuntu-latest

    env:
      LLM_API_URL: "http://127.0.0.1:9999"
      LLM_API_KEY: "ci-test-placeholder"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip check

      - name: Ruff lint checks
        run: |
          python -m ruff check app/workflows tests
          python -m ruff check app/validation/rule_evaluator.py app/validation/source_verifier.py --select E4,E7,E9,F

      - name: Run complete backend test suite
        run: |
          python -m pytest -q