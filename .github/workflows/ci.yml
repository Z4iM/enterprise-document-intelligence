name: Enterprise Document Intelligence CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ==========================================
  # Backend: Python Tests and Code Quality
  # ==========================================
  tests:
    name: Python Tests and Code Quality
    runs-on: ubuntu-latest

    env:
      LLM_API_URL: "http://127.0.0.1:9999"
      LLM_API_KEY: "ci-test-placeholder"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip check

      - name: Ruff lint checks (entire project)
        run: python -m ruff check .

      - name: Run complete backend test suite
        run: python -m pytest -q

      - name: Reproduce synthetic keyword retrieval baseline (no model/network)
        run: python evals/retrieval/run.py --output .local/retrieval-lexical-ci.json

      - name: Reproduce bilingual reference and specialist control-flow evaluations
        run: |
          python evals/bilingual/run.py --check-native --output .local/bilingual-ci.json
          python evals/specialists/run.py --output .local/specialists-ci.json

      - name: Enforce reproducible release regression gates (no provider inference)
        run: python evals/release/run.py --output-directory .local/release --ocr-report docs/benchmarks/bilingual-m6.json

      - name: Preserve measured reports and explicit quality blockers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: synthetic-release-report
          path: .local/release/*.json
          retention-days: 7

  # ==========================================
  # Frontend: TypeScript and Production Build
  # ==========================================
  frontend:
    name: Next.js TypeScript, Production Build and Browser Security
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit pinned frontend runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check TypeScript
        run: npm run lint

      - name: Build Next.js frontend
        run: npm run build

      - name: Set up Python for synthetic browser backend
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install browser backend dependencies
        run: python -m pip install -r ../requirements-ci.txt

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Exercise authenticated browser lifecycle
        env:
          EDI_BROWSER_CHANNEL: chromium
          EDI_TEST_PYTHON: python
        run: npm run test:e2e

      - name: Exercise isolated development specialist workflow with synthetic model generation
        env:
          EDI_BROWSER_CHANNEL: chromium
          EDI_TEST_PYTHON: python
          EDI_E2E_WORKFLOW_DEV: "true"
        run: npx playwright test specialist-journey.spec.ts

      - name: Rehearse empty English and Arabic showcase with scripted generation
        env:
          EDI_BROWSER_CHANNEL: chromium
          EDI_TEST_PYTHON: python
          EDI_E2E_WORKFLOW_DEV: "true"
          EDI_E2E_SHOWCASE: "true"
        run: npx playwright test showcase.spec.ts

  postgres:
    name: Real PostgreSQL migrations, import and recovery
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: edi_ci
          POSTGRES_PASSWORD: synthetic-ci-only-password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edi_ci -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-ci.txt
      - name: Test actual PostgreSQL dialect and preserved data
        env:
          EDI_POSTGRES_TEST_URL: postgresql+psycopg://edi_ci:synthetic-ci-only-password@127.0.0.1:5432/postgres
        run: python -m pytest -q tests/test_postgres_integration.py

  containers:
    name: Compose build and durable synthetic smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate both Compose configurations using isolated dummy secrets
        run: python scripts/verify_compose.py
      - name: Build serially and verify both isolated profiles, HTTP intake and full restarts
        run: python scripts/verify_containers.py --run-id c61031202601

      - name: Install checksum-pinned image scanner
        id: scanner
        run: python scripts/install_grype.py --directory .local/security-tools

      - name: Scan backend image for fixable high/critical vulnerabilities
        run: .local/security-tools/grype docker:edi-verification-backend:c61031202601 --only-fixed --fail-on high -o json --file .local/backend-vulnerabilities.json

      - name: Scan frontend even if backend vulnerabilities are found
        if: ${{ !cancelled() && steps.scanner.outcome == 'success' }}
        run: .local/security-tools/grype docker:edi-verification-frontend:c61031202601 --only-fixed --fail-on high -o json --file .local/frontend-vulnerabilities.json

      - name: Preserve image vulnerability reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: container-vulnerability-reports
          path: .local/*-vulnerabilities.json
          retention-days: 7

  dependencies:
    name: Pinned Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-security.txt
      - name: Audit runtime pins without resolving or installing application dependencies
        run: python -m pip_audit -r requirements-runtime.txt --no-deps --disable-pip --strict --format=json --output python-vulnerabilities.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: python-vulnerability-report
          path: python-vulnerabilities.json
          retention-days: 7
