name: Enterprise Document Intelligence CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ==========================================
  # Backend: Python Tests and Code Quality
  # ==========================================
  tests:
    name: Python Tests and Code Quality
    runs-on: ubuntu-latest

    env:
      LLM_API_URL: "http://127.0.0.1:9999"
      LLM_API_KEY: "ci-test-placeholder"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip check

      - name: Ruff lint checks (entire project)
        run: python -m ruff check .

      - name: Run complete backend test suite
        run: python -m pytest -q

  # ==========================================
  # Frontend: TypeScript and Production Build
  # ==========================================
  frontend:
    name: Next.js TypeScript and Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run lint

      - name: Build Next.js frontend
        run: npm run build
